[variables]
NIXPACKS_PYTHON_VERSION = "3.13"

[phases.setup]
nixPkgs = ["ffmpeg"]

[phases.install]
cmds = [
  "python -m pip install --upgrade pip",
  "python -m pip install --no-cache-dir -r requirements.txt",
  "python -m pip install --no-cache-dir \"discord.py[voice]==2.7.1\" audioop-lts",
  "python -c \"import discord, discord.voice_state as vs, discord.voice_client as vc; print(f'python={__import__(\\\"sys\\\").version}'); print(f'discord.py={discord.__version__}'); print(f'has_nacl={vc.has_nacl}'); print(f'has_dave={getattr(vc, \\\"has_dave\\\", False)}'); assert vc.has_nacl, 'PyNaCl failed to load during build'; assert getattr(vc, 'has_dave', False), 'davey failed to load during build'\""
]

[start]
cmd = "python ./discord-bot/main.py"
